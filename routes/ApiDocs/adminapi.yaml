openapi: 3.0.0
info:
  title: Faveo API
  version: 1.0.0
  description: Combined API for managing System Settings, Job Scheduler, Logs, and other administrative features.
servers:
  - url: /
security:
  - bearerAuth: []

paths:
  #region System Settings
  /systemSettings/list:
    get:
      tags:
        - Settings
      summary: Fetch system settings
      description: Retrieves the core system settings.
      operationId: getSystemSettings
      responses:
        '200':
          description: System settings fetched successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SettingResponse'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /systemSettings/update:
    post:
      tags:
        - Settings
      summary: Update system settings
      description: Updates various system-wide settings.
      operationId: updateSystemSettings
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/SettingPayload'
      responses:
        '200':
          description: Settings updated successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/InternalServerError'
  #endregion

  #region Job Scheduler
  /job-scheduler:
    get:
      tags:
        - Job Scheduler
      summary: Get scheduler settings
      description: Retrieves the current settings and status of the job scheduler.
      operationId: getJobScheduler
      responses:
        '200':
          description: Scheduler settings retrieved successfully.
          content:
            application/json:
              schema:
                type: object
                properties:
                  scheduler_status:
                    type: integer
                    example: 1
                  cron_command:
                    type: string
                    example: "* * * * * /usr/bin/php /var/www/html/artisan schedule:run >> /dev/null 2>&1"
                  frequency:
                    type: string
                    example: "daily"
                  days:
                    type: array
                    items:
                      type: string
                    example: ["monday", "friday"]
        '500':
          $ref: '#/components/responses/InternalServerError'

  /post-scheduler:
    patch:
      tags:
        - Job Scheduler
      summary: Update scheduler settings
      description: Updates the job scheduler's main settings.
      operationId: updateJobScheduler
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                scheduler_status:
                  type: integer
                  description: "Set to 1 to enable the scheduler, 0 to disable."
                  example: 1
                frequency:
                  type: string
                  description: "The desired run frequency."
                  enum: [every_minute, every_five_minutes, every_ten_minutes, every_thirty_minutes, hourly, daily]
                  example: "daily"
      responses:
        '200':
          description: Scheduler updated successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /cron-days:
    patch:
      tags:
        - Job Scheduler
      summary: Save cron run days
      description: Updates the specific days of the week or month that the cron job is allowed to run.
      operationId: saveCronRunDays
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                days:
                  type: array
                  items:
                    type: string
                  example: ["monday", "friday"]
      responses:
        '200':
          description: Cron days updated successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /verify-php-path:
    post:
      tags:
        - Job Scheduler
      summary: Verify PHP executable path
      description: Checks if the provided path to the PHP executable is valid.
      operationId: verifyPhpPath
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - php_path
              properties:
                php_path:
                  type: string
                  example: "/usr/bin/php"
      responses:
        '200':
          description: The path is valid.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "PHP executable path is valid."
        '400':
          description: The path is invalid or not executable.
        '500':
          $ref: '#/components/responses/InternalServerError'

  /cron/condition/{job}:
    get:
      tags:
        - Job Scheduler
      summary: Get cron job conditions
      description: Retrieves the specific conditions for a given scheduled job.
      operationId: getCronJobConditions
      parameters:
        - name: job
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Cron job conditions retrieved successfully.
        '404':
          description: The specified job was not found.
        '500':
          $ref: '#/components/responses/InternalServerError'
  #endregion

  #region License Management
  /get-license-type:
    get:
      tags:
        - License Types
      summary: Get all license types
      description: Retrieves a list of all available license types.
      operationId: getLicenseTypes
      responses:
        '200':
          description: A list of license types.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/LicenseType'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /create-license-type:
    post:
      tags:
        - License Types
      summary: Create a new license type
      description: Adds a new license type to the system.
      operationId: createLicenseType
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LicenseTypePayload'
      responses:
        '201':
          description: License type created successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LicenseType'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /update-license-type/{id}:
    put:
      tags:
        - License Types
      summary: Update a license type
      description: Updates the details of an existing license type by its ID.
      operationId: updateLicenseType
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LicenseTypePayload'
      responses:
        '200':
          description: License type updated successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LicenseType'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /delete-license-type:
    delete:
      tags:
        - License Types
      summary: Delete license type(s)
      description: Deletes one or more license types based on their IDs.
      operationId: deleteLicenseTypes
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - ids
              properties:
                ids:
                  type: array
                  items:
                    type: integer
                  example: [3, 5]
      responses:
        '200':
          description: License type(s) deleted successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /get-license-permission:
    get:
      tags:
        - Permissions
      summary: Get all permissions
      description: Retrieves a list of all available permissions.
      operationId: getPermissions
      responses:
        '200':
          description: A list of permissions.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Permission'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /add-permission:
    post:
      tags:
        - Permissions
      summary: Create a new permission
      description: Adds a new permission to the system.
      operationId: addPermission
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
                - slug
              properties:
                name:
                  type: string
                  example: 'Create Tickets'
                slug:
                  type: string
                  example: 'tickets.create'
      responses:
        '201':
          description: Permission created successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Permission'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/InternalServerError'
  #endregion

  #region File Storage
  /file-storage:
    get:
      tags:
        - File Storage
      summary: Get file storage settings
      description: Retrieves the current file storage configuration.
      operationId: getFileStorageSettings
      responses:
        '200':
          description: File storage settings retrieved successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FileStorageSettingsResponse'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /file-storage-path:
    post:
      tags:
        - File Storage
      summary: Update file storage settings
      description: Updates the file storage configuration.
      operationId: updateFileStorageSettings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - $ref: '#/components/schemas/LocalStoragePayload'
                - $ref: '#/components/schemas/S3StoragePayload'
      responses:
        '200':
          description: Settings updated successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '400':
          description: Bad Request (e.g., invalid S3 credentials).
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/InternalServerError'
  #endregion

  #region Third-Party Apps
  /get-third-party-app:
    get:
      tags:
        - Third-Party Apps
      summary: Get all third-party apps
      description: Retrieves a list of all configured third-party applications.
      operationId: getThirdPartyApps
      responses:
        '200':
          description: A list of third-party applications.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ThirdPartyApp'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /third-party-app-create:
    post:
      tags:
        - Third-Party Apps
      summary: Create a new third-party app
      description: Adds a new third-party application configuration.
      operationId: createThirdPartyApp
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ThirdPartyAppPayload'
      responses:
        '201':
          description: Application created successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ThirdPartyApp'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /third-party-app-update/{id}:
    put:
      tags:
        - Third-Party Apps
      summary: Update a third-party app
      description: Updates an existing third-party application by its ID.
      operationId: updateThirdPartyApp
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ThirdPartyAppPayload'
      responses:
        '200':
          description: Application updated successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ThirdPartyApp'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /get-app-key:
    get:
      tags:
        - Third-Party Apps
      summary: Get a specific app key
      description: Retrieves a single third-party application by its name.
      operationId: getAppKeyByName
      parameters:
        - name: app_name
          in: query
          required: true
          schema:
            type: string
            example: 'faveo_app_key'
      responses:
        '200':
          description: App details retrieved successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ThirdPartyApp'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /third-party-delete:
    delete:
      tags:
        - Third-Party Apps
      summary: Delete third-party app(s)
      description: Deletes one or more third-party applications by their IDs.
      operationId: deleteThirdPartyApps
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - ids
              properties:
                ids:
                  type: array
                  items:
                    type: integer
                  example: [2, 4]
      responses:
        '200':
          description: Application(s) deleted successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
  #endregion

  #region Debugging
  /debugg:
    get:
      tags:
        - Debugging
      summary: Get debug settings
      description: Retrieves the current state of the application's debug settings.
      operationId: getDebugSettings
      responses:
        '200':
          description: Returns the view for debug settings.
          content:
            text/html: {}

  /save/debugg:
    post:
      tags:
        - Debugging
      summary: Update debug settings
      description: Enables or disables various debugging tools for the application.
      operationId: updateDebugSettings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                debug:
                  type: string
                  description: "Set to 'true' to enable debugging, 'false' to disable."
                  enum: ["true", "false"]
                  example: "true"
      responses:
        '200':
          description: Debug settings updated successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '500':
          $ref: '#/components/responses/InternalServerError'
  #endregion

  #region Social Logins
  /social-logins:
    get:
      tags:
        - Social Logins
      summary: Get social login providers
      description: Retrieves a paginated list of configured social login providers.
      operationId: getSocialLoginProviders
      parameters:
        - name: search-query
          in: query
          schema:
            type: string
        - name: sort-field
          in: query
          schema:
            type: string
            default: created_at
        - name: sort-order
          in: query
          schema:
            type: string
            enum: [asc, desc]
            default: desc
        - name: limit
          in: query
          schema:
            type: integer
            default: 10
      responses:
        '200':
          description: A paginated list of social login providers.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SocialLoginResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /edit/SocialLogins/{id}:
    get:
      tags:
        - Social Logins
      summary: Get a specific social login provider
      description: Retrieves the details of a single social login provider by its ID.
      operationId: getSocialLoginProviderById
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Social login provider details retrieved successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SocialLoginResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /update-social-login:
    post:
      tags:
        - Social Logins
      summary: Update a social login provider
      description: Updates the settings for a social login provider.
      operationId: updateSocialLoginProvider
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SocialLoginPayload'
      responses:
        '200':
          description: Settings updated successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/InternalServerError'
  #endregion

  #region Languages
  /languages:
    get:
      tags:
        - Languages
      summary: Get all languages
      description: Retrieves a paginated list of all languages available in the system.
      operationId: getLanguages
      parameters:
        - name: search-query
          in: query
          schema:
            type: string
        - name: sort-field
          in: query
          schema:
            type: string
            default: name
        - name: sort-order
          in: query
          schema:
            type: string
            enum: [asc, desc]
            default: asc
        - name: limit
          in: query
          schema:
            type: integer
            default: 10
      responses:
        '200':
          description: A paginated list of languages.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LanguageResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /language-toggle:
    post:
      tags:
        - Languages
      summary: Toggle language status
      description: Enables or disables a specific language in the system.
      operationId: toggleLanguageStatus
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - locale
                - status
              properties:
                locale:
                  type: string
                  example: "fr"
                status:
                  type: boolean
                  example: true
      responses:
        '200':
          description: Language status updated successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '422':
          $ref: '#/components/responses/ValidationError'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
  #endregion

  #region Widgets
  /widgets/list:
    get:
      tags:
        - Widgets
      summary: Get all widgets
      description: Retrieves a paginated list of widgets.
      operationId: getWidgetList
      parameters:
        - name: search-query
          in: query
          schema:
            type: string
        - name: sort-field
          in: query
          schema:
            type: string
            default: created_at
        - name: sort-order
          in: query
          schema:
            type: string
            enum: [asc, desc]
            default: desc
        - name: limit
          in: query
          schema:
            type: integer
            default: 10
      responses:
        '200':
          description: A paginated list of widgets.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WidgetListResponse'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /widgets/show/{id}:
    get:
      tags:
        - Widgets
      summary: Get a specific widget
      description: Retrieves the details of a single widget by its ID.
      operationId: getWidgetById
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Widget details retrieved successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WidgetResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /widgets/create:
    post:
      tags:
        - Widgets
      summary: Create a new widget
      description: Creates a new widget.
      operationId: createWidget
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WidgetPayload'
      responses:
        '201':
          description: Widget created successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /widgets/update/{id}:
    put:
      tags:
        - Widgets
      summary: Update a widget
      description: Updates an existing widget.
      operationId: updateWidget
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WidgetPayload'
      responses:
        '200':
          description: Widget updated successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WidgetUpdateResponse'
        '400':
          description: Bad Request.
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /widgets/delete:
    delete:
      tags:
        - Widgets
      summary: Delete widget(s)
      description: Deletes one or more widgets by their IDs.
      operationId: deleteWidgets
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - select
              properties:
                select:
                  type: array
                  items:
                    type: integer
                  example: [1, 3]
      responses:
        '200':
          description: Widget(s) deleted successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '400':
          description: Bad Request.
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
  #endregion

  #region Chat Scripts
  /chat/list:
    get:
      tags:
        - Chat Scripts
      summary: Get all chat scripts
      description: Retrieves a paginated list of chat scripts.
      operationId: getChatScriptList
      parameters:
        - name: search-query
          in: query
          schema:
            type: string
        - name: sort-field
          in: query
          schema:
            type: string
            default: created_at
        - name: sort-order
          in: query
          schema:
            type: string
            enum: [asc, desc]
            default: desc
        - name: limit
          in: query
          schema:
            type: integer
            default: 10
      responses:
        '200':
          description: A paginated list of chat scripts.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatScriptListResponse'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /chat/show/{id}:
    get:
      tags:
        - Chat Scripts
      summary: Get a specific chat script
      description: Retrieves the details of a single chat script by its ID.
      operationId: getChatScriptById
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Chat script details retrieved successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatScriptResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /chat/create:
    post:
      tags:
        - Chat Scripts
      summary: Create a new chat script
      description: Adds a new chat or analytics script to the system.
      operationId: createChatScript
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChatScriptPayload'
      responses:
        '200':
          description: Script created successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /chat/update/{id}:
    put:
      tags:
        - Chat Scripts
      summary: Update a chat script
      description: Updates an existing chat script.
      operationId: updateChatScript
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
