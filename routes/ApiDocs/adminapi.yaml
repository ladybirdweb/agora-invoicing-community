# --- COMPONENTS ---
components:
  schemas:
    #region Settings
    Setting:
      type: object
      properties:
        id:
          type: integer
          example: 1
        company:
          type: string
          example: 'Faveo'
        website:
          type: string
          format: url
          example: 'https://www.faveohelpdesk.com'
        default_currency:
          type: object
          properties:
            id:
              type: integer
              example: 1
            code:
              type: string
              example: 'USD'
            name:
              type: string
              example: 'US Dollar'
        country:
          type: object
          properties:
            country_id:
              type: integer
              example: 101
            country_name:
              type: string
              example: 'India'
            country_code_char2:
              type: string
              example: 'IN'
        state:
          type: object
          properties:
            state_subdivision_id:
              type: integer
              example: 4029
            state_subdivision_name:
              type: string
              example: 'Karnataka'
            state_subdivision_code:
              type: string
              example: 'IN-KA'
        language:
          type: object
          properties:
            id:
              type: integer
              example: 1
            name:
              type: string
              example: 'English'
            locale:
              type: string
              example: 'en'
    SettingResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: "System settings fetched successfully"
        data:
          $ref: '#/components/schemas/Setting'
    SettingPayload:
      type: object
      required:
        - company
        - company_email
        - website
        - phone
        - address
        - city
        - zip
        - language
        - state
        - default_currency
        - country
      properties:
        company:
          type: string
          example: 'Faveo Inc.'
        company_email:
          type: string
          format: email
          example: 'support@faveo.com'
        website:
          type: string
          format: url
          example: 'https://www.faveo.com'
        phone:
          type: string
          example: '9876543210'
        address:
          type: string
          example: '123 Faveo Way'
        city:
          type: string
          example: 'Bengaluru'
        zip:
          type: string
          example: '560001'
        language:
          type: string
          example: 'en'
        state:
          type: string
          example: 'IN-KA'
        default_currency:
          type: string
          example: 'INR'
        country:
          type: string
          example: 'IN'
        logo:
          type: string
          format: binary
        admin-logo:
          type: string
          format: binary
        fav-icon:
          type: string
          format: binary
    #endregion

    #region License
    LicenseType:
      type: object
      properties:
        id:
          type: integer
          example: 1
        name:
          type: string
          example: 'Standard'
        description:
          type: string
          example: 'Basic features'
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    LicenseTypePayload:
      type: object
      required:
        - name
      properties:
        name:
          type: string
          example: 'Premium'
        description:
          type: string
          example: 'Access to all features'
    Permission:
      type: object
      properties:
        id:
          type: integer
          example: 101
        name:
          type: string
          example: 'View Reports'
        slug:
          type: string
          example: 'reports.view'
    #endregion

    #region File Storage
    FileStorageSettings:
      type: object
      properties:
        disk:
          type: string
          enum: [system, s3]
          example: 'system'
        local_file_storage_path:
          type: string
          example: '/var/www/html/storage/app/public'
        s3_bucket:
          type: string
        s3_region:
          type: string
        s3_access_key:
          type: string
        s3_secret_key:
          type: string
        s3_endpoint_url:
          type: string
          format: url
        s3_url:
          type: string
          format: url
        s3_path_style_endpoint:
          type: string
    FileStorageSettingsResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          $ref: '#/components/schemas/FileStorageSettings'
    LocalStoragePayload:
      type: object
      required:
        - disk
        - path
      properties:
        disk:
          type: string
          enum: [system]
        path:
          type: string
    S3StoragePayload:
      type: object
      required:
        - disk
        - s3_bucket
        - s3_region
        - s3_access_key
        - s3_secret_key
      properties:
        disk:
          type: string
          enum: [s3]
        s3_bucket:
          type: string
        s3_region:
          type: string
        s3_access_key:
          type: string
        s3_secret_key:
          type: string
        s3_endpoint_url:
          type: string
          format: url
        s3_url:
          type: string
          format: url
        s3_path_style_endpoint:
          type: string
    #endregion

    #region Third-Party Apps
    ThirdPartyApp:
      type: object
      properties:
        id:
          type: integer
          example: 1
        app_name:
          type: string
          example: 'faveo_app_key'
        app_key:
          type: string
          example: 'key_live_12345'
        app_secret:
          type: string
          example: 'secret_live_67890'
    ThirdPartyAppPayload:
      type: object
      required:
        - app_name
      properties:
        app_name:
          type: string
          example: 'My Custom Integration'
        app_key:
          type: string
        app_secret:
          type: string
    #endregion

    #region Social Logins
    SocialLogin:
      type: object
      properties:
        id:
          type: integer
          example: 1
        type:
          type: string
          example: 'Google'
        client_id:
          type: string
        client_secret:
          type: string
        redirect_url:
          type: string
          format: url
        status:
          type: integer
          example: 1
    SocialLoginResponse:
      type: object
      properties:
        success:
          type: boolean
        data:
          type: object
          properties:
            current_page:
              type: integer
            data:
              type: array
              items:
                $ref: '#/components/schemas/SocialLogin'
            # ... other pagination fields
    SocialLoginPayload:
      type: object
      required:
        - type
        - redirect_url
      properties:
        type:
          type: string
          enum: [Google, Github, Linkedin, Twitter]
        client_id:
          type: string
        client_secret:
          type: string
        api_key:
          type: string
        api_secret:
          type: string
        redirect_url:
          type: string
          format: url
        optradio:
          type: integer
          enum: [0, 1]
    #endregion

    #region Languages
    Language:
      type: object
      properties:
        id:
          type: integer
          example: 1
        name:
          type: string
          example: 'English'
        locale:
          type: string
          example: 'en'
        status:
          type: integer
          example: 1
    LanguageResponse:
      type: object
      properties:
        success:
          type: boolean
        message:
          type: string
        data:
          type: object
          properties:
            languages:
              type: object
              properties:
                current_page:
                  type: integer
                data:
                  type: array
                  items:
                    $ref: '#/components/schemas/Language'
                # ... other pagination fields
            default_language:
              type: string
              example: "en"
    #endregion

    #region Widgets
    Widget:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        type:
          type: string
        publish:
          type: integer
        content:
          type: string
        allow_mailchimp:
          type: integer
        allow_social_media:
          type: integer
    WidgetListItem:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        type:
          type: string
        created_at:
          type: string
        content:
          type: string
        action:
          type: string
    WidgetPayload:
      type: object
      required:
        - name
        - publish
        - type
      properties:
        name:
          type: string
          maxLength: 50
        publish:
          type: integer
          enum: [0, 1]
        type:
          type: string
        content:
          type: string
        allow_mailchimp:
          type: integer
          enum: [0, 1]
        allow_social_media:
          type: integer
          enum: [0, 1]
    WidgetListResponse:
      type: object
      properties:
        success:
          type: boolean
        message:
          type: string
        data:
          type: object
          properties:
            pages:
              type: object
              properties:
                current_page:
                  type: integer
                data:
                  type: array
                  items:
                    $ref: '#/components/schemas/WidgetListItem'
                # ... other pagination fields
            total:
              type: integer
    WidgetResponse:
      type: object
      properties:
        success:
          type: boolean
        message:
          type: string
        data:
          type: object
          properties:
            widget:
              $ref: '#/components/schemas/Widget'
            mailchimpStatus:
              type: integer
            twitterStatus:
              type: integer
    WidgetUpdateResponse:
      type: object
      properties:
        success:
          type: boolean
        message:
          type: string
        data:
          type: object
          properties:
            widgets:
              $ref: '#/components/schemas/Widget'
    #endregion

    #region Chat Scripts
    ChatScript:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        script:
          type: string
        on_registration:
          type: integer
        on_every_page:
          type: integer
        google_analytics:
          type: integer
        google_analytics_tag:
          type: string
          nullable: true
    ChatScriptListItem:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        checkbox:
          type: integer
        action:
          type: string
    ChatScriptPayload:
      type: object
      required:
        - name
        - script
      properties:
        name:
          type: string
          maxLength: 50
        script:
          type: string
        on_registration:
          type: integer
          enum: [0, 1]
        google_analytics:
          type: integer
          enum: [0, 1]
        google_analytics_tag:
          type: string
    ChatScriptListResponse:
      type: object
      properties:
        success:
          type: boolean
        message:
          type: string
        data:
