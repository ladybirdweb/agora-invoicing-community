# Not product source: generated, third-party or built files, Jenkins helper scripts (scripts/,
# already skipped by PHPStan), and ide-helper stubs that exist only for editor autocomplete.
# Test code too, wherever it lives: plugins and modules keep their own tests/ or Tests/
# folders (app/License/tests, app/Plugins/Zoho/Tests, ...), not only the root tests/.
# Also local-only files that are gitignored and never in a PR: .env* (machine secrets) and node_modules.
# database/seeders: install/upgrade data lists (countries, states, currencies…), long by nature —
# "split this 11,000-line function" is noise there, not a code problem.
sonar.exclusions=bootstrap/cache/**,vendor/**,storage/**,public/**,scripts/**,_ide_helper.php,_ide_helper_models.php,.phpstorm.meta.php,**/tests/**,**/Tests/**,**/*Test.php,.env*,node_modules/**,database/seeders/**

sonar.issue.ignore.multicriteria=e1,e2,e3,e4,e5,e6,e7,e8,e9,e10,e11,e12,e13,e14,e15,e16,e17,e18,e19,e20,e21,e22,e23,e24,e25,e26,e27,e28,e29,e30,e31,e32,e33,e34,e35,e36,e37,e38,e39,e40,e41,e42,e43,e44,e45

# php:S1192 ("define a constant instead of duplicating this literal") is meaningless on
# translation files: flat key => string arrays where the same short word (e.g. "Total")
# legitimately repeats under unrelated keys. Suppressed for lang directories only —
# both lang/ and module Lang/ folders (app/License/Lang), since the pattern is case-sensitive.
sonar.issue.ignore.multicriteria.e1.ruleKey=php:S1192
sonar.issue.ignore.multicriteria.e1.resourceKey=**/lang/**/*.php
sonar.issue.ignore.multicriteria.e2.ruleKey=php:S1192
sonar.issue.ignore.multicriteria.e2.resourceKey=**/Lang/**/*.php
# Same for Form Request classes: declarative rule lists where 'max:255' etc. repeating is
# normal Laravel style — constants there would only make the rules harder to read.
sonar.issue.ignore.multicriteria.e6.ruleKey=php:S1192
sonar.issue.ignore.multicriteria.e6.resourceKey=**/Requests/**/*.php
# Route files and config files are the same kind of declarative list ('throttle:20,1',
# 'show/{id}', '{{amount}}' placeholders…), and a route group is one long closure by design.
sonar.issue.ignore.multicriteria.e7.ruleKey=php:S1192
sonar.issue.ignore.multicriteria.e7.resourceKey=routes/**/*.php
sonar.issue.ignore.multicriteria.e8.ruleKey=php:S1192
sonar.issue.ignore.multicriteria.e8.resourceKey=config/**/*.php
sonar.issue.ignore.multicriteria.e9.ruleKey=php:S138
sonar.issue.ignore.multicriteria.e9.resourceKey=routes/**/*.php

# Team decision: style rules that conflict with how this Laravel codebase is written.
# php:S1142 — "more than 3 returns": early-return guard clauses are the house style.
sonar.issue.ignore.multicriteria.e3.ruleKey=php:S1142
sonar.issue.ignore.multicriteria.e3.resourceKey=**/*
# php:S112 — "throw a dedicated exception instead of a generic one".
sonar.issue.ignore.multicriteria.e4.ruleKey=php:S112
sonar.issue.ignore.multicriteria.e4.resourceKey=**/*
# php:S4833 — "replace require with use": service providers require plain helper files
# (functions, not classes), which `use` cannot load.
sonar.issue.ignore.multicriteria.e5.ruleKey=php:S4833
sonar.issue.ignore.multicriteria.e5.resourceKey=**/*

# ---- Vue templates and <style> blocks -------------------------------------------------
# NOSONAR comments are not honoured inside .vue <template> and <style> (verified on a local scan), so
# these reviewed warnings are ignored here instead — each for one rule in the named files only.
# Bootstrap/ARIA patterns kept on purpose: dropdown toggles and clickable cards (role="button" with keyboard handling),
# Bootstrap progress bars and modals, a styled card heading, a loading/status message, and the QR-code SVG labelled as an image.
